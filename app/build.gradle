apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'applovin-quality-service'
applovin {
    apiKey = "Do7qR6FHTExrl8KTepl4WgT8HXalr0ytRTrlSomLL6gFBg20yXxobfUoJUzW7BHU9sxdcZp0aXNQQdRBEFAdvA"
}
android {
    namespace 'com.plutodesk.mahjongblast'
    compileSdkVersion 35
    defaultConfig {
        applicationId 'com.plutodesk.mahjongblast'
        minSdkVersion 23
        targetSdkVersion 35
        buildToolsVersion '30.0.3'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        versionCode 30
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // PlayCanvas 的 wasm/tar 等资源在 APK 里被压缩后，WebView 读取可能失败或卡在 loading
    androidResources {
        noCompress += ['wasm', 'tar', 'mjs', 'js', 'json', 'br', 'basis', 'glb']
    }

}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def buildTypeName = variant.buildType
            def version = android.defaultConfig.versionName ?: "1.0"
            output.outputFileName.set("${buildTypeName}_v${version}.apk")
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.bidderdesk.sdk.admob.mediation:baseLib:1.0.12'

    implementation 'com.getkeepsafe.relinker:relinker:1.4.4' //relinker
    implementation 'org.greenrobot:eventbus:3.3.1'
}