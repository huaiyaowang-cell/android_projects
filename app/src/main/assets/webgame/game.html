	<style>
		#loading-container {
		  position: fixed;
		  top: 0;
		  left: 0;
		  width: 100vw;
		  height: 100vh;
		  backdrop-filter: blur(30px);

		  width: 40%;

		  left: 50%;

		}
		.loading-header-logo-image {
		  width: 100%;
		  border-radius: 5px;
		}
		.loading-progress-text {
		  text-align: center;
		  position: absolute;
		  width: 100%;
		  bottom: 330px;
		  font-size: 20px;
		  color: white;
		}
		.loading-progress-bar {
		  position: absolute;
		  width: 80%;
		  height: 20px;
		  background: #0b6084;
		  margin: auto;
		  left: 0;
		  right: 0;
		  bottom: 300px;
		  border-radius: 10px;
		}
		.loading-progress-bar-inner {
		  position: absolute;
		  top: 0;
		  left: 0;
		  width: 0%;
		  height: 100%;
		  background: #dbe8ed;
		  border-radius: 10px;
		}
	  </style>
	   <div id="loading-container" >
		 <div class="loading-header-logo">
		   <img src="__assets__/icon.png" class="loading-header-logo-image" alt="logo">
		 </div>
		 <div class="loading-progress-text">Loading...</div>
		 <div class="loading-progress-bar" >
		   <div class="loading-progress-bar-inner"></div>
		 </div>
	   </div>
	   <script> 
		let cocosStarted = false;
		let totalCount = 70;
		let currentFetchReturnCount = 0;
		window.updateLoadingProgress = function(progress) {
		   const loadingProgressBarInner = document.querySelector('.loading-progress-bar-inner');
		   loadingProgressBarInner && (loadingProgressBarInner.style.width = `${Math.round(progress)}%`);
		   const loadingProgressText = document.querySelector('.loading-progress-text');
		   loadingProgressText && (loadingProgressText.textContent = `Loading... ${Math.round(progress)}%`);
		   if(progress >= 100) {
			window.removeLoadingContainer();
		   }
		}
		window.removeLoadingContainer = function() {
		  const loadingContainer = document.getElementById('loading-container');
		  loadingContainer && loadingContainer.remove();
		}
		window.updateLoadingProgressFetch = function() {
		  currentFetchReturnCount++;
		  const progress = Math.round(currentFetchReturnCount / totalCount * 100);
		  updateLoadingProgress(progress);
		}
		// 创建 PerformanceObserver 实例，监听资源加载
		
		const observer = new PerformanceObserver((list) => {
		  list.getEntries().forEach((entry) => {
			// 只关注「资源加载」类型的请求（排除页面、脚本执行等其他类型）
			if (entry.entryType === 'resource') {
			  updateLoadingProgressFetch();
			}
		  });
		});
		observer.observe({
		  entryTypes: ['resource', 'navigation']
		});
	
	// 停止监听（如需）：observer.disconnect();
	   </script>
