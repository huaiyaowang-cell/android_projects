<!DOCTYPE html>
<html lang="en">
<head>
  <script src="request-guard.js"></script>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>
  <title>Perfect Landing, Plane Pilot</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    #plppLayout { width: 100%; height: 100%; display: flex; flex-direction: column; }
    #plppTopAdSlot, #plppBottomAdSlot { width: 100%; overflow: hidden; flex-shrink: 0; display: flex; justify-content: center; background: #000; }
    #plppGameFrame { width: 100%; border: 0; flex: 1; min-height: 0; background: #000; }
  </style>
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4202034217897578"
    crossorigin="anonymous">
  </script>
  <script>
    window.alert = function() {
      console.log("alert", arguments);
    };

    window.__googleAdsReady = false;
    (function trackGoogleAdsSdkReady() {
      var sdkScript = document.querySelector('script[src*="googlesyndication.com/pagead/js/adsbygoogle.js"]');
      if (!sdkScript) return;
      sdkScript.addEventListener("load", function () {
        window.__googleAdsReady = true;
      });
      sdkScript.addEventListener("error", function () {
        window.__googleAdsReady = false;
      });
    })();

    window.adsbygoogle = window.adsbygoogle || [];
    var adBreak = adConfig = function (o) { window.adsbygoogle.push(o); };
    adConfig({ preloadAdBreaks: "on" });
  </script>
</head>
<body>
  <div id="plppLayout">
    <div id="plppTopAdSlot">
      <ins class="adsbygoogle"
        style="display:inline-block;width:320px;height:50px"
        data-ad-client="ca-pub-4202034217897578"
        data-ad-slot="9174285658"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    <iframe
      src="game.html"
      id="plppGameFrame"
      name="plppGameFrame"
      scrolling="no"
      allow="autoplay; fullscreen"
      title="Perfect Landing, Plane Pilot"
    ></iframe>
    <div id="plppBottomAdSlot">
      <ins class="adsbygoogle"
        style="display:inline-block;width:320px;height:100px"
        data-ad-client="ca-pub-4202034217897578"
        data-ad-slot="4864961822"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>
  <script>
    document.getElementById("plppTopAdSlot").style.height = "50px";
    document.getElementById("plppBottomAdSlot").style.height = "100px";
  </script>
  <script src="poki-ad-bridge-parent-0.0.1.js"></script>
</body>
</html>
