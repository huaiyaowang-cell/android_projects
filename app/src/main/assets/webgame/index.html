<!DOCTYPE html>
<html lang="en">
<head>
  <script src="request-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>
  <title>Bullet Bros</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #bbLayout {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #bbGameFrame {
      width: 100%;
      border: 0;
      flex: 1;
      min-height: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="bbLayout">
    <iframe
      src="game.html"
      id="bbGameFrame"
      name="bbGameFrame"
      scrolling="no"
      allow="autoplay"
      title="Bullet Bros"
    ></iframe>
  </div>
  <script src="./poki-ad-bridge-parent.js"></script>
  <script>
    window.__back_locked__ = true;
    history.pushState(null, null, location.href);
    window.addEventListener("popstate", function () {
      if (__back_locked__) {
        history.pushState(null, null, location.href);
        __back_locked__ = false;
      }
    });
  </script>
</body>
</html>
