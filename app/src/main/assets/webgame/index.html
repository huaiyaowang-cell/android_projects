<!DOCTYPE html>
<html lang="en">
<head>
  <script src="request-guard.js"></script>
  <script src="native-admob-jssdk.js"></script>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>
  <title>My Perfect Hotel</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #mphLayout {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #mphTopAdSlot, #mphBottomAdSlot {
      width: 100%;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      background: #000;
    }
    #mphGameFrame {
      width: 100%;
      border: 0;
      flex: 1;
      min-height: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="mphLayout">
    <div id="mphTopAdSlot"></div>
    <iframe
      src="game.html"
      id="mphGameFrame"
      name="mphGameFrame"
      scrolling="no"
      allow="autoplay; fullscreen"
      title="My Perfect Hotel"
    ></iframe>
    <div id="mphBottomAdSlot"></div>
  </div>
  <script>
    // 纯本地 APK：网页广告位隐藏，广告由 Android Native 侧展示
    var topSlot = document.getElementById("mphTopAdSlot");
    var bottomSlot = document.getElementById("mphBottomAdSlot");
    if (topSlot) { topSlot.style.display = "none"; topSlot.style.height = "0"; }
    if (bottomSlot) { bottomSlot.style.display = "none"; bottomSlot.style.height = "0"; }
  </script>
  <script src="poki-ad-bridge-parent.js"></script>
</body>
</html>
