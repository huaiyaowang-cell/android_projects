<!DOCTYPE html>
<html lang="en">
<head>
  <script src="request-guard.js"></script>
  <script src="native-admob-jssdk.js"></script>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>
  <title>Count War</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #cwLayout {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #cwTopAdSlot, #cwBottomAdSlot {
      width: 100%;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      background: #000;
    }
    #cwGameFrame {
      width: 100%;
      border: 0;
      flex: 1;
      min-height: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="cwLayout">
    <div id="cwTopAdSlot"></div>
    <iframe
      src="game.html"
      id="cwGameFrame"
      name="cwGameFrame"
      scrolling="no"
      allow="autoplay *; fullscreen *"
      title="Count War"
    ></iframe>
    <div id="cwBottomAdSlot"></div>
  </div>
  <script>
    // 纯本地 APK：网页广告位隐藏，广告由 Android Native 侧展示
    var topSlot = document.getElementById("cwTopAdSlot");
    var bottomSlot = document.getElementById("cwBottomAdSlot");
    if (topSlot) { topSlot.style.display = "none"; topSlot.style.height = "0"; }
    if (bottomSlot) { bottomSlot.style.display = "none"; bottomSlot.style.height = "0"; }

    function unlockIframeAudio() {
      var frame = document.getElementById("cwGameFrame");
      if (!frame || !frame.contentWindow) return;
      try {
        frame.contentWindow.postMessage({ type: "unlock_audio" }, "*");
      } catch (e) {}
      try {
        if (frame.contentWindow.__resumeGameAudio) frame.contentWindow.__resumeGameAudio();
      } catch (e2) {}
    }
    ["touchstart", "touchend", "click", "pointerdown"].forEach(function (ev) {
      document.addEventListener(ev, unlockIframeAudio, { passive: true, capture: true });
    });
  </script>
  <script src="poki-ad-bridge-parent.js"></script>
</body>
</html>
