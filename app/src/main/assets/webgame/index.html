
<!DOCTYPE html>
<html lang="en">
<head>
  <script src="request-guard.js"></script>
  <script src="native-admob-jssdk.js"></script>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>
  <title>Talking Tom Gold Run</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    #ttgrLayout { width: 100%; height: 100%; display: flex; flex-direction: column; }
    #ttgrTopAdSlot, #ttgrBottomAdSlot { width: 100%; overflow: hidden; flex-shrink: 0; display: none; justify-content: center; background: #000; }
    #ttgrGameFrame { width: 100%; border: 0; flex: 1; min-height: 0; background: #000; }
  </style>
  <script>
    window.alert = function() {
      console.log("alert", arguments);
    };

    window.__googleAdsReady = false;
    window.adsbygoogle = window.adsbygoogle || [];
    var adBreak = adConfig = function (o) { window.adsbygoogle.push(o); };
  </script>
</head>
<body>
  <div id="ttgrLayout">
    <div id="ttgrTopAdSlot"></div>
    <iframe
      src="game.html"
      id="ttgrGameFrame"
      name="ttgrGameFrame"
      scrolling="no"
      allow="autoplay; fullscreen"
      title="Talking Tom Gold Run"
    ></iframe>
    <div id="ttgrBottomAdSlot"></div>
  </div>
  <script>
    document.getElementById("ttgrTopAdSlot").style.height = "0";
    document.getElementById("ttgrBottomAdSlot").style.height = "0";
  </script>
  <script src="poki-ad-bridge-parent-0.0.2.js"></script>
</body>
</html>
